name: DeMegaPOS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── pnpm: version MUST match the "packageManager" field in package.json ──
      # Using version: 10 to match pnpm@10.18.3 declared in root package.json.
      # pnpm v8 does NOT support the `pnpm run <script> --filter=<pkg>` syntax
      # correctly — it strips the filter and looks for the script inside the
      # filtered package directly, causing ERR_PNPM_NO_SCRIPT.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # ── DB package: generate Prisma Client ──────────────────────────────────
      # Uses canonical `pnpm --filter <pkg> <script>` syntax (not pnpm run <script> --filter).
      # prisma generate does NOT require DATABASE_URL — only the schema file.
      - name: Build Database Package (Prisma Generate)
        run: pnpm --filter @demegapos/db build

      # ── Backend: TypeScript compile ─────────────────────────────────────────
      - name: Build Backend Application
        run: pnpm --filter demegapos-backend build

      # ── Web frontends: TypeScript + Vite bundle ─────────────────────────────
      - name: Build Web Back-Office
        run: pnpm --filter web-back-office build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000' }}

      - name: Build Web Kitchen Display
        run: pnpm --filter web-kitchen build

      - name: Build Web Customer Portal
        run: pnpm --filter web-customer build

      # ── Docker Images ───────────────────────────────────────────────────────
      - name: Docker Build (Backend)
        run: docker build -t demegapos-backend -f apps/backend/Dockerfile .

      - name: Docker Build (Web Back-Office)
        run: docker build -t demegapos-back-office -f apps/web-back-office/Dockerfile .
